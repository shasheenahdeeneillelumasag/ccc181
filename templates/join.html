{% extends "base.html" %}
{% block title %}Join the queue · ReliefQ{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-md-8 col-lg-6">
    <h1 class="h3 mb-3">Join the queue</h1>

    <form method="post" action="{{ url_for('join') }}">
  
      <div class="mb-3">
        <label for="name" class="form-label">Head of Family Name</label>
        <input 
        type="text" 
        id="name" 
        name="name" 
        class="form-control" 
        maxlength="100" 
        required
      >
    </div>

    <div class="mb-3">
      <label for="household_size" class="form-label">Household Size (number of family members)</label>
      <input 
        type="number" 
        id="household_size" 
        name="household_size" 
        class="form-control" 
        min="1" 
        max="100"
        required
      >
    </div>

    <div class="mb-3">
      <label for="barangay_id" class="form-label">Barangay</label>
      <select id="barangay_id" name="barangay_id" class="form-select" required>
        <option value="">Select your barangay</option>
        {% for barangay in barangays %}
          <option value="{{ barangay.id }}">{{ barangay.name }}</option>
        {% endfor %}
      </select>
  </div>

  <button type="submit" class="btn btn-primary w-100">Get Ticket</button>
</form>

      <div class="mb-3">
        <label for="household_size" class="form-label">Number of family members</label>
        <input id="household_size" name="household_size" type="number" min="1"
               inputmode="numeric" required
               class="form-control {% if errors and errors.household_size %}is-invalid{% endif %}"
               value="{{ form.get('household_size', '') }}"
               {% if errors and errors.household_size %}aria-describedby="household_size-error"{% endif %}>
        {% if errors and errors.household_size %}
          <div id="household_size-error" class="invalid-feedback">{{ errors.household_size }}</div>
        {% endif %}
      </div>

      <div class="mb-3">
        <label for="barangay_id" class="form-label">Barangay and time slot</label>
        <select id="barangay_id" name="barangay_id" required
                class="form-select {% if errors and errors.barangay_id %}is-invalid{% endif %}"
                {% if errors and errors.barangay_id %}aria-describedby="barangay_id-error"{% endif %}>
          <option value="">Choose your barangay and time slot…</option>
          {% for b in barangays %}
            <option value="{{ b.id }}"
              {% if form.get('barangay_id') == b.id|string %}selected{% endif %}>{{ b.name }} ({{ b.slot_time.strftime("%I:%M %p").lstrip("0") }})</option>
          {% endfor %}
        </select>
        {% if errors and errors.barangay_id %}
          <div id="barangay_id-error" class="invalid-feedback">{{ errors.barangay_id }}</div>
        {% endif %}
      </div>

      <button type="submit" class="btn btn-primary w-100">Get a ticket</button>
    </form>
  </div>
</div>
{% endblock %}
